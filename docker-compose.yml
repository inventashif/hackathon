services:
  nexussop:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexussop:local
    env_file:
      - .env
    environment:
      SOP_DB_PATH: /app/data/nexus_sop.sqlite3
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
